<html>
    <head>
        <title>Drop Culture - Cadastrar Categoria</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h2>Gerenciamento de Categorias (CADASTRAR)</h2>
        <form method="post" action="cat_cad.jsp">
            <p>Nome <input type="text" name="nome" required></p>
            <p>Slug <input type="text" name="slug" required></p>
            <p>Descrição <input type="text" name="descricao"> </p>
            <p>Público-alvo<input type="text" name="publ_alvo"> </p>
            <p>Estilo-alvo<input type="text" name="estilo"></p>
            <p>Imagem URL<input type="file" name="img_url"></p>
            <p>Ativa<input type="checkbox" name="ativa" value="true" checked></p>
            <p>Ordem de exibição<input type="number" name="ordem_exib" value="0"></p>
            <p>
                <input type="submit" value="Processar">
                <input type="reset" value="Limpar">
            </p>
        </form>
    </body>
</html>
